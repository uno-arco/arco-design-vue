name: deploy-docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm i --frozen-lockfile
        env:
          HUSKY: 0

      - run: pnpm run init

      - name: Build site
        run: NODE_OPTIONS=--max-old-space-size=8192 AssetsPublicPath=/arco-design-vue/ pnpm run build:site

      # SPA deep links: GitHub Pages has no history fallback; serve the app shell as 404.html.
      - name: Add GitHub Pages SPA fallback
        run: cp packages/arco-vue-docs/dist/index.html packages/arco-vue-docs/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/arco-vue-docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
